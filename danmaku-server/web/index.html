<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>弹幕时光机</title>
  <!-- 内联空 favicon: 避免浏览器自动请求 /favicon.ico 产生 404 噪声(本地服务无该路由) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%235b8cff'/%3E%3Ctext x='16' y='23' font-size='17' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='%23fff'%3E弹%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 顶栏: 当前场次 + 环境数据。不再放大段说明, 也不放品牌大标语 ——
       页面本身就是"弹幕时光机", 顶栏那个蓝底标签只占位置、抢视线。 -->
  <header id="topbar">
    <h1 id="match-title">待加载</h1>
    <span id="live-badge">回放</span>
    <span class="topbar-sp"></span>
    <span id="topbar-meta" class="topbar-meta"></span>
    <span id="clock-now">--:--:--</span>
    <span id="app-version" class="app-version" title="程序版本号"></span>
  </header>

  <!--
    当晚总览: 置顶常驻(sticky)。
    为什么钉在顶部: 切场是这个页面的高频动作, 而总览是唯一的切场入口 ——
    放在页面底部时, 每次切场都要滚到底再滚回来。
    默认紧凑(密度 + 场次色带, 66px), 点「展开分P」才显示完整的分P 行。
  -->
  <section id="dock" class="dock">
    <div class="dock-head">
      <b>当晚总览</b>
      <span id="ov-summary" class="dock-stat">--</span>
      <span class="dock-sp"></span>
      <button type="button" class="nbtn" id="btn-ov-expand" title="展开/收起分P 行">展开分P ▾</button>
      <button type="button" class="nbtn" id="btn-ov-refresh" title="重新读取当晚数据与各场分段">刷新</button>
    </div>
    <div class="dock-body">
      <div id="ov-wrap">
        <canvas id="ov-canvas"></canvas>
      </div>
      <div id="ov-legend" class="ov-legend"></div>
    </div>
  </section>

  <!-- 主区: 画面(随宽度通栏放大) + 右侧弹幕栏 -->
  <main class="main">
    <div class="stage-col">
      <div class="player-wrap">
        <video id="video" playsinline preload="auto"></video>
        <canvas id="danmaku-canvas"></canvas>
        <span id="speed-badge" hidden>2×</span>
        <div id="ctrl-bar">
          <!-- 进度条独占一整行(B站 结构): 宽度铺满, 不被按钮挤压, 拖动精度高 -->
          <div id="prog-row">
            <div id="prog" title="进度条（←/→ 快退快进，长按 ←/→ 2倍速）">
              <div id="prog-inner"></div>
              <div id="prog-marks"></div>
              <div id="prog-thumb"></div>
            </div>
          </div>
          <div id="btn-row">
            <button id="btn-play" type="button" class="cbtn ico" title="播放/暂停（空格）">▶</button>
            <span id="time-label">--:--</span>
            <span class="ctr-spacer"></span>
            <button id="btn-skip" type="button" class="cbtn" title="跳到下一局" hidden>下一局</button>

            <span class="cmenu-wrap">
              <button id="btn-quality" type="button" class="cbtn" title="画质">画质</button>
              <div id="menu-quality" class="cmenu" hidden></div>
            </span>
            <span class="cmenu-wrap">
              <button id="btn-rate" type="button" class="cbtn" title="播放速度（Shift+, / Shift+.）">1.0×</button>
              <div id="menu-rate" class="cmenu" hidden></div>
            </span>
            <span class="cmenu-wrap">
              <button id="btn-dm-set" type="button" class="cbtn ico" title="弹幕设置">⚙</button>
              <div id="panel-dm-set" class="cmenu cpanel" hidden>
                <div class="cpanel-head">弹幕设置</div>
                <label class="cpanel-row"><span>显示区域</span>
                  <select id="sel-dm-area">
                    <option value="1">满屏</option>
                    <option value="0.75">3/4 屏</option>
                    <option value="0.5" selected>半屏</option>
                    <option value="0.25">1/4 屏</option>
                  </select>
                </label>
                <label class="cpanel-row"><span>不透明度</span>
                  <input id="rng-dm-opacity" type="range" min="20" max="100" step="5" value="90">
                </label>
                <label class="cpanel-row"><span>弹幕字号</span>
                  <select id="sel-dm-size">
                    <option value="20" selected>小</option>
                    <option value="26">中</option>
                    <option value="34">大</option>
                  </select>
                </label>
                <label class="cpanel-row"><span>弹幕速度</span>
                  <input id="rng-dm-speed" type="range" min="60" max="200" step="10" value="100">
                </label>
                <label class="cpanel-row"><span>弹幕数量</span>
                  <select id="sel-dm-density">
                    <option value="1" selected>全部</option>
                    <option value="0.5">一半</option>
                    <option value="0.25">较少</option>
                    <option value="0.1">更少</option>
                  </select>
                </label>
                <label class="cpanel-chk"><input id="chk-dm-stroke" type="checkbox"> 文字描边</label>
                <!-- 屏蔽词: 一行一个(逗号、分号、空格也当分隔), 命中即整条不上屏、也不进右侧列表。
                     和上面「弹幕数量」的抽稀一样是"整条丢弃", 不做只挡飘屏的半套。
                     放在面板最下方: 它是低频的"救火"设置(有人刷屏才来填一次), 不像字号/速度要边看边调。 -->
                <label class="cpanel-col">
                  <span>屏蔽词 <em id="block-count"></em></span>
                  <textarea id="inp-dm-block" rows="3" spellcheck="false" autocomplete="off"
                            placeholder="一行一个，命中即屏蔽。例：赌狗&#10;返场&#10;抽奖"></textarea>
                </label>
                <div class="cpanel-foot">
                  <button id="btn-dm-toggle" type="button" class="btn btn-sm">弹幕: 开</button>
                  <button id="btn-dm-reset" type="button" class="btn btn-sm btn-ghost">恢复默认</button>
                </div>
              </div>
            </span>
            <button id="btn-dm-quick" type="button" class="cbtn" title="显示/隐藏弹幕">弹</button>
            <!-- 音量: 图标 + 悬停时向上弹出的竖向滑块(B站 的做法)。
                 横条滑块常驻会占掉 72px, 把「弹/音量/全屏」挤到换行;
                 竖向只有在想调的时候才出现, 平时只留一个图标。 -->
            <span class="vol-wrap">
              <button id="btn-mute" type="button" class="cbtn ico" title="静音">🔊</button>
              <span class="vol-pop">
                <input id="rng-vol" type="range" min="0" max="100" value="100" title="音量">
                <b id="vol-num">100</b>
              </span>
            </span>
            <button id="btn-fs" type="button" class="cbtn ico" title="全屏（含弹幕层）">⛶</button>
          </div>
        </div>
        <div id="player-mask"><span class="mask-text">正在加载…</span></div>
      </div>
    </div>

    <!-- 右侧弹幕栏: 顺带承担直播间氛围(在线人数 + 装饰性发送框)
         外层 .rail-slot 只负责"占一列、没有内在高度", 内层 .rail 绝对定位铺满它,
         这样弹幕再多也不会把主区撑高(详见 style.css 里 .main 的注释)。 -->
    <div class="rail-slot">
    <aside id="side" class="rail">
      <div class="rail-head">弹幕 <em id="dm-online"></em></div>
      <div id="sc-banner" hidden></div>
      <div id="dm-list"></div>
      <div id="chat-box">
        <input type="text" placeholder="装饰性输入，发送不可用" disabled>
        <button type="button" disabled>发送</button>
      </div>
    </aside>
    </div>
  </main>

  <!--
    工具条: 原来"选择场次 / 校准 / 播放设置"三张卡片各占一行、每张只有一行控件,
    加起来 240px 几乎全是空白。这里合并成一条, 低频项(自定义 BV / 偏移 / 手动微调)
    收进「更多」。
  -->
  <section class="panel toolbar">
    <div class="tool-row">
      <label class="fld fld-date"><span>日期</span>
        <select id="sel-date"></select>
      </label>
      <label class="fld fld-grow fld-match"><span>场次</span>
        <select id="sel-match"></select>
      </label>
      <label class="fld fld-grow"><span>弹幕</span>
        <select id="sel-file"></select>
      </label>
      <button id="btn-apply" type="button" class="btn btn-primary">播放</button>
      <span class="tool-sep"></span>
      <button id="btn-spoiler" type="button" class="btn btn-toggle" title="隐藏时间标记与分P 色块">防剧透</button>
      <button id="btn-auto-advance" type="button" class="btn btn-toggle on" title="一场播完自动接下一场">连播：开</button>
      <span class="tool-sep"></span>
      <button type="button" class="nbtn" id="btn-update"
              title="从 GitHub 拉取作者新采集的弹幕（含场次信息与音频指纹）；只下缺的，不动已有数据，也不改动程序文件">拉取弹幕</button>
      <button type="button" class="nbtn" id="btn-discover"
              title="从 Riot 官方赛程自动发现当天场次，并在B站搜索官方回放 BV">刷新赛程</button>
      <button type="button" class="nbtn" id="btn-more" title="更多设置">更多 ▾</button>
    </div>

    <div id="update-status" class="align-status" hidden></div>

    <!-- 低频/兜底项: 默认收起。
         自动校准放这里是有意的: 它是"数据没对齐时的一次性补救", 一场只需点一次,
         摆在主行里却是最宽的一个按钮, 会把场次/弹幕下拉框挤成省略号。
         对齐结果(align-status)跟着进来 —— 否则点完校准还得抬头看主条下方,
         而那条结果离按钮太远, 容易被当成"没反应"。 -->
    <div id="more-box" class="more-box" hidden>
      <label class="fld"><span>BV 号</span>
        <input id="inp-bv" type="text" placeholder="BV1xx411c7mD" spellcheck="false" autocomplete="off">
      </label>
      <label class="fld"><span>初始偏移（秒）</span>
        <input id="inp-offset" type="number" step="1" value="0">
      </label>
      <!-- 自动校准紧挨在手动微调前面: 两者是同一个动作的两种做法 ——
           先用它算出 offset, 不满意再用后面的 ±5/±10 手动推。
           中间隔着 BV/初始偏移会让人以为它们各管一摊。 -->
      <button type="button" class="nbtn" id="btn-auto-align"
              title="用直播音频指纹与官方回放互相关，自动算出 offset">自动校准</button>
      <span id="align-cur" class="align-cur">offset: --</span>
      <span class="fld"><span>手动微调</span></span>
      <span class="nudge" id="manual-calib" title="即时微调弹幕对齐">
        <button type="button" class="nbtn" data-d="-30">-30</button><button type="button" class="nbtn" data-d="-10">-10</button><button type="button" class="nbtn" data-d="-5">-5</button><button type="button" class="nbtn" data-d="5">+5</button><button type="button" class="nbtn" data-d="10">+10</button><button type="button" class="nbtn" data-d="30">+30</button>
      </span>
      <div id="align-status" class="align-status" hidden></div>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
